name: mechupp_app
description: MechUpp - Your Bike. Our Responsibility. On-demand bike servicing platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: 2.6.1

  # Navigation
  go_router: 13.2.5

  # UI
  google_fonts: 6.3.3
  shimmer: 3.0.0
  carousel_slider: 5.1.2
  smooth_page_indicator: 1.2.1
  flutter_animate: 4.5.2
  fl_chart: 0.68.0
  pinput: 5.0.2

  # Network & Storage
  shared_preferences: 2.5.5
  dio: 5.10.0
  intl: 0.20.2

  # Platform
  url_launcher: 6.3.2
  image_picker: 1.2.3
  share_plus: 9.0.0
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
  generate: true
