name: mechupp_app
description: MechUpp - Your Bike. Our Responsibility. On-demand bike servicing platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: 2.6.1

  # Navigation
  go_router: 13.2.5

  # UI
  google_fonts: 6.3.3
  shimmer: 3.0.0
  carousel_slider: 5.1.2
  smooth_page_indicator: 1.2.1
  flutter_animate: 4.5.2
  fl_chart: 0.68.0
  pinput: 5.0.2

  # Network & Storage
  shared_preferences: 2.5.5
  dio: 5.10.0
  intl: 0.20.2

  # Platform
  url_launcher: 6.3.2
  geolocator: 13.0.4 # device GPS for the service address and location permission
  permission_handler: 11.4.0 # OS notification permission prompt
  image_picker: 1.2.3 # capture parts photos.
  share_plus: 11.0.0 # share the invoice file
  path_provider: 2.1.6
  retrofit: 4.10.0
  json_annotation: 4.12.0
  freezed_annotation: 3.1.0
  firebase_core: 3.15.0
  firebase_auth: 5.5.0
  firebase_database: 11.3.8 # RTDB live location adapter (FR-TRK-004).
  drift: 2.35.2
  drift_flutter: 0.3.1
  sqlite3_flutter_libs: 0.6.0+eol
  uuid: 4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2
  build_runner: 2.15.1
  retrofit_generator: 10.2.12
  json_serializable: 6.14.1
  swagger_parser: 1.45.0
  freezed: 4.0.0-dev.3
  drift_dev: 2.35.0

flutter:
  uses-material-design: true
  generate: true
