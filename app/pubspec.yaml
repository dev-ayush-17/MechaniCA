name: mechupp_app
description: MechUpp - Your Bike. Our Responsibility. On-demand bike servicing platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  fl_chart: ^0.68.0
  pinput: ^5.0.0
  percent_indicator: ^4.2.3
  dotted_border: ^2.1.0
  flutter_staggered_animations: ^1.1.1

  # Network & Storage
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  intl: ^0.19.0

  # Platform
  url_launcher: ^6.2.6
  image_picker: ^1.1.2
  share_plus: ^9.0.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
